schema_version: 1

context:
  version: "0.1.4"

package:
  name: af-jupyterlab-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/af_jupyterlab_mcp/af_jupyterlab_mcp-${{ version }}.tar.gz
  sha256: 33a539b7b9121a5c187bb02a4907c61807b5d4e8f5431cae6b5b5f4390aa62ce

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=0.7
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - mcp >=2.0.0,<3
    - python-kubernetes >=30
    - jinja2 >=3.1
    - pyyaml >=6
    - af-credentials >=0.2.0

tests:
  - python:
      imports:
        - af_jupyterlab_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: MCP server for per-user, impersonated jupyterlab access on the AF platform
  homepage: https://github.com/maniaclab/af-jupyterlab-mcp
  repository: https://github.com/maniaclab/af-jupyterlab-mcp
  documentation: https://maniaclab.uchicago.edu/af-jupyterlab-mcp/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kratsg
